# .github/workflows/windows-gi-reactor.yml
#
# CI to test the GI/GTK reactor fix on Windows.
# Uses native Python + gvsbuild for GTK3/PyGObject (not MSYS2, which
# reports os.name='posix' and skips all Windows code paths).
#
# References:
#   - https://github.com/twisted/twisted/issues/11987

name: Windows GI Reactor Tests

env:
  GH_TOKEN: ${{ github.token }}
  UV_SYSTEM_PYTHON: 1
  UV_LINK_MODE: copy

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  workflow_dispatch:

jobs:
  windows-gi-test:
    name: "Windows GI Reactor"
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      GTK_ROOT: C:\gtk

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install GTK via gvsbuild
        shell: bash
        run: |
          gh release download $GVSBUILD_VERSION \
            --repo wingtk/gvsbuild \
            --pattern 'GTK3_Gvsbuild_*.zip' \
            --output gtk.zip
          7z x gtk.zip -o$GTK_ROOT
        env:
          # See https://github.com/wingtk/gvsbuild/releases
          GVSBUILD_VERSION: 2025.9.0  # Python 3.13, pycairo 1.28.0, pygobject 3.54.0

      - name: Set GTK environment
        shell: bash
        run: |
          echo "$GTK_ROOT/bin" >> $GITHUB_PATH
          echo "$GTK_ROOT/lib" >> $GITHUB_PATH
          echo "LIB=$GTK_ROOT/lib" >> $GITHUB_ENV
          echo "INCLUDE=$GTK_ROOT/include" >> $GITHUB_ENV
          # Force UV to use the gvsbuild wheels instead of PyPI
          echo "UV_FIND_LINKS=$GTK_ROOT/wheels" >> $GITHUB_ENV
          printf 'pycairo==1.28.0\npygobject==3.54.0\n' > $GTK_ROOT/constraints.txt
          echo "UV_CONSTRAINT=$GTK_ROOT/constraints.txt" >> $GITHUB_ENV

      - name: Install Twisted
        run: |
          uv pip install -e ".[dev,windows-platform,gtk-platform]"

      - name: Verify GTK3 and gi are available
        run: |
          python -c "
          import sys, os
          print(f'Python {sys.version}')
          print(f'sys.platform: {sys.platform}')
          print(f'os.name: {os.name}')
          import gi
          print(f'gi version: {gi.__version__}')
          gi.require_version('GLib', '2.0')
          from gi.repository import GLib
          print('GLib available')
          "

      - name: Smoke test
        timeout-minutes: 2
        run: |
          python -c "
          import time
          from twisted.internet import gireactor
          reactor = gireactor.install()

          start = time.time()
          results = []

          def delayed():
              elapsed = time.time() - start
              results.append(elapsed)
              print(f'callLater fired after {elapsed:.2f}s')
              reactor.stop()

          reactor.callLater(0.5, delayed)
          reactor.run(installSignalHandlers=False)

          elapsed = results[0]
          assert elapsed < 5.0, f'callLater took {elapsed:.2f}s — waker/timeout broken'
          print(f'PASS: callLater completed in {elapsed:.2f}s')
          "

      - name: Run test for reactor gi (non-TLS)
        timeout-minutes: 3
        run: >
          python -m twisted.trial --reactor=gi
          twisted.internet.test.test_gireactor
          twisted.internet.test.test_glibbase

      - name: Run TLS test with debug logging
        timeout-minutes: 3
        run: >
          python -m twisted.trial --reactor=gi
          -k GIReactor
          twisted.internet.test.test_newtls
          twisted.internet.test.test_tcp
