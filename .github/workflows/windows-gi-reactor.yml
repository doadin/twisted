# .github/workflows/windows-gi-reactor.yml
#
# CI to test the GI/GTK reactor fix on Windows.
# Uses native Python + gvsbuild for GTK3/PyGObject (not MSYS2, which
# reports os.name='posix' and skips all Windows code paths).
#
# References:
#   - https://github.com/twisted/twisted/issues/11987

name: Windows GI Reactor Tests

env:
  GH_TOKEN: ${{ github.token }}
  UV_SYSTEM_PYTHON: 1
  UV_LINK_MODE: copy

on:
  push:
    branches: [trunk, "11987-*"]
  pull_request:
    branches: [trunk]
  workflow_dispatch:

jobs:
  windows-gi-test:
    name: "Windows GI Reactor"
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # - name: Cache GTK (gvsbuild)
      #   id: cache-gtk
      #   uses: actions/cache@v4
      #   with:
      #     path: C:\gtk
      #     key: gvsbuild-GTK3-2025.9.0

      - name: Install GTK via gvsbuild
        if: steps.cache-gtk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          gh release download 2025.9.0 --repo wingtk/gvsbuild --pattern 'GTK3*.zip' -O - | 7z x -si -oC:\\gtk

      - name: Set GTK environment
        shell: bash
        run: |
          echo "C:\\gtk\\bin" >> $GITHUB_PATH
          echo "C:\\gtk\\lib" >> $GITHUB_PATH
          echo "LIB=C:\\gtk\\lib;$LIB" >> $GITHUB_ENV
          echo "INCLUDE=C:\\gtk\\include;$INCLUDE" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=C:\\gtk\\lib\\pkgconfig" >> $GITHUB_ENV
          echo "UV_FIND_LINKS=C:\\gtk\\wheels" >> $GITHUB_ENV
          printf 'pycairo==1.28.0\npygobject==3.54.0\n' > C:/gtk/constraints.txt
          echo "UV_CONSTRAINT=C:\\gtk\\constraints.txt" >> $GITHUB_ENV

      - name: Install Twisted
        run: |
          uv pip install -e ".[dev,windows-platform,gtk-platform]"

      - name: Verify GTK3 and gi are available
        run: |
          python -c "
          import sys, os
          print(f'Python {sys.version}')
          print(f'sys.platform: {sys.platform}')
          print(f'os.name: {os.name}')
          import gi
          print(f'gi version: {gi.__version__}')
          gi.require_version('GLib', '2.0')
          from gi.repository import GLib
          print('GLib available')
          "

      - name: Smoke test - import and install
        timeout-minutes: 2
        run: |
          python -c "
          try:
              from twisted.internet import gireactor
              reactor = gireactor.install()
              print(f'Reactor installed: {type(reactor).__name__}')
          except NameError as e:
              print(f'EXPECTED FAILURE (Layer 1): {e}')
              raise SystemExit(1)
          except Exception as e:
              print(f'UNEXPECTED ERROR: {type(e).__name__}: {e}')
              raise SystemExit(1)
          "

      - name: Smoke test - callLater timing
        timeout-minutes: 2
        run: |
          python -c "
          import time
          from twisted.internet import gireactor
          reactor = gireactor.install()

          start = time.time()
          results = []

          def delayed():
              elapsed = time.time() - start
              results.append(elapsed)
              print(f'callLater fired after {elapsed:.2f}s')
              reactor.stop()

          reactor.callLater(0.5, delayed)
          reactor.run(installSignalHandlers=False)

          elapsed = results[0]
          assert elapsed < 5.0, f'callLater took {elapsed:.2f}s — waker/timeout broken'
          print(f'PASS: callLater completed in {elapsed:.2f}s')
          "

      - name: Run test_gireactor with --reactor=gi
        timeout-minutes: 5
        run: |
          python -m twisted.trial --reactor=gi twisted.internet.test.test_gireactor

      - name: Run test_glibbase with --reactor=gi
        timeout-minutes: 5
        run: |
          python -m twisted.trial --reactor=gi twisted.internet.test.test_glibbase

      # - name: Run test_newtls with --reactor=gi
      #   timeout-minutes: 2
      #   run: |
      #     python -m twisted.trial --reactor=gi twisted.internet.test.test_newtls
